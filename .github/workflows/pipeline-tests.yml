# Fast test rung on every push, so agents stop running it on the laptop.
#
# CI is a clean checkout: no 11 GB product corpus, no built exports. Tests that
# need them are declared in scripts/test_profiles.py LOCAL_ONLY_TEST_FILES and
# run on the Mac with `scripts/test.sh local`. scripts/ci_skip_guard.py fails
# this job if any other test skips, so nothing passes here by not running.
name: pipeline-tests

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Classify committed change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" != refs/heads/main ]]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi
          kind=$(python scripts/ci_change_scope.py --repo . --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $kind" >> "$GITHUB_STEP_SUMMARY"

  fast:
    needs: scope
    if: needs.scope.outputs.kind == 'full'
    # The exact project Python has a 24.04 build; ubuntu-latest may advance first.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FLUTTER_REPO: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: seancheick/Pharmaguide.ai
          path: app

      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/dashboard/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject new Python correctness errors
        if: matrix.shard == 0
        run: python scripts/check_python_correctness.py

      - name: Install print-fixture fonts and catalog SQL test dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation postgresql-16 postgresql-contrib

      - name: Fast rung
        run: |
          export PG_PYTHON="$(command -v python)"
          # Each job selects a disjoint slice of the canonical fast profile,
          # balanced by measured duration (scripts/tests/shard_plan.json).
          export PG_TEST_WORKERS=1
          export PG_TEST_SHARD_INDEX=${{ matrix.shard }}
          export PG_TEST_SHARD_COUNT=4
          (while true; do free -m | awk 'NR==2 {print "ci-memory used=" $3 "MB free=" $4 "MB"}'; sleep 30; done) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          scripts/test.sh fast --junitxml=ci-junit.xml -rs -vv

      - name: Every skip matches its declared reason
        if: always()
        run: python scripts/ci_skip_guard.py ci-junit.xml

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: junit-fast-${{ matrix.shard }}
          path: ci-junit.xml
          if-no-files-found: error

  merge-ready:
    name: Merge readiness
    runs-on: ubuntu-24.04
    if: always()
    needs: [scope, fast]
    steps:
      - name: Require the selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          KIND: ${{ needs.scope.outputs.kind }}
          FAST_RESULT: ${{ needs.fast.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$KIND" in
            docs) test "$FAST_RESULT" = skipped ;;
            full) test "$FAST_RESULT" = success ;;
            *) exit 1 ;;
          esac
