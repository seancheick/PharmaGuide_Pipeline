# Fast test rung on every push, so agents stop running it on the laptop.
#
# CI is a clean checkout: no 11 GB product corpus, no built exports. Tests that
# need them are declared in scripts/test_profiles.py LOCAL_ONLY_TEST_FILES and
# run on the Mac with `scripts/test.sh local`. scripts/ci_skip_guard.py fails
# this job if any other test skips, so nothing passes here by not running.
name: pipeline-tests

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Memory grows with every module one process imports: the whole fast
    # profile reached 15.6 GB on the 16 GB runner even with one worker and was
    # cancelled (run 37022949990). Four shards, each a fresh runner, bound
    # memory and run in parallel.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Cross-repo contract tests compare pipeline vocabularies and schemas
      # with the app's files; the app repo is public, so CI checks it out.
      FLUTTER_REPO: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: seancheick/Pharmaguide.ai
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/dashboard/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fast rung
        run: |
          export PG_PYTHON="$(command -v python)"
          # Memory every 30 s: a runner that runs out of RAM is cancelled
          # without a pytest summary, so this is the only trace it leaves.
          (while true; do free -m | awk 'NR==2 {print "ci-memory used=" $3 "MB free=" $4 "MB"}'; sleep 30; done) &
          export PG_TEST_SHARD="${{ matrix.shard }}/4"
          # test.sh passes -q; -vv nets verbose, naming each test as it
          # finishes so failures survive a cut-off run.
          scripts/test.sh fast --junitxml=ci-junit.xml -rs -vv

      - name: Every skip is a declared local-only test
        if: always()
        run: python scripts/ci_skip_guard.py ci-junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-fast-${{ matrix.shard }}
          path: ci-junit.xml
